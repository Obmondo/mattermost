name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - master
      - conflict-fix-05
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mattermost-server

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'server/go.mod'
          cache-dependency-path: 'server/go.sum'

      - name: Download pre-built WebApp assets
        run: |
          # Download the official release to extract the compiled client (frontend) assets
          # This avoids needing to compile the massive node/react codebase from scratch!
          mkdir -p ../webapp/channels/dist
          curl -L https://releases.mattermost.com/11.5.1/mattermost-11.5.1-linux-amd64.tar.gz | tar -xz -C ../webapp/channels/dist --strip-components=2 mattermost/client

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image using Make
        working-directory: ./server
        run: |
          make docker-build-local LOCAL_IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-cache

      - name: Tag and Push Docker image
        run: |
          # Loop through all generated tags from the meta action and tag/push
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-cache $tag
            docker push $tag
          done
